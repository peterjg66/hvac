<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter's Engineering Toolkit</title>
    <style>
        /* 기본 여백 초기화 및 부드러운 글꼴 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            overflow: hidden;
        }

        /* [기본 설정] 스마트폰 세로 화면: 위/아래 3등분 세로 배치 */
        .container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: repeat(3, 1fr);
            height: 100vh;
            width: 100vw;
        }

        /* 공통 카드(버튼) 디자인 */
        .card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        /* 1. 좌측 상단 HVAC 구역: 신뢰감을 주는 블루 계열 */
        .hvac {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        /* 2. 우측 상단 ELEC 구역: 스마트한 그린 계열 */
        .elec {
            background: linear-gradient(135deg, #0f9d58, #004d40);
        }

        /* 3. 하단 중앙 CLOCK 구역: 세련된 다크 퍼플 & 인디고 계열 */
        .clock {
            background: linear-gradient(135deg, #311b92, #1a237e);
        }

        /* 마우스를 올렸을 때 밝아지고 살짝 확대되는 효과 */
        .card:hover {
            filter: brightness(1.2);
            transform: scale(1.01);
            z-index: 10;
        }

        .card h1 {
            font-size: 2.6rem;
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        .card p {
            font-size: 1.15rem;
            opacity: 0.85;
            font-weight: bold;
        }

        /* [화면 반응형 설정] PC나 태블릿(768px 이상): 삼각 구도 배치 (상단 2개 + 하단 1개) */
        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr; /* 좌/우 2열 */
                grid-template-rows: 1fr 1fr;    /* 상/하 2행 */
            }
            /* 시계 카드를 하단 2칸 전체(가로 전체)로 확장하여 삼각 구도 완성 */
            .clock {
                grid-column: 1 / span 2;
            }
            .card h1 {
                font-size: 3.2rem;
            }
            .card p {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 좌측: HVAC 링크 영역 -->
        <a href="hvac_toolkit(total).html" class="card hvac">
            <h1>HVAC</h1>
            <p>공조 계산 및 툴킷 통합본</p>
        </a>

        <!-- 상단 우측: ELEC 링크 영역 -->
        <a href="elec_ref.html" class="card elec">
            <h1>ELEC</h1>
            <p>전기 집계 및 레퍼런스 모듈</p>
        </a>

        <!-- 하단 중앙(와이드): CLOCK 링크 영역 (시계 파일명에 맞게 href 수정 가능) -->
        <a href="clock.html" class="card clock">
            <h1>CLOCK</h1>
            <p>스마트 시계 & 워크 타이머 / 스톱워치</p>
        </a>
    </div>

</body>
</html>
