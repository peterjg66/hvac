<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>차량 번호판 감별기</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #16a34a;
      --danger: #dc2626;
      --warn: #d97706;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      max-width: 680px;
      margin: 0 auto;
    }

    /* 상단 헤더 */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    .header-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mini-btn {
      padding: 6px 9px;
      font-size: 0.76rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #334155;
      color: #f8fafc;
      cursor: pointer;
    }
    .mini-btn.wake-on {
      background: var(--warn);
      border-color: #fbbf24;
      color: #fff;
    }
    .badge {
      font-size: 0.75rem;
      padding: 5px 9px;
      border-radius: 999px;
      background: #334155;
      color: #e2e8f0;
      font-weight: 600;
    }
    .badge.ready { background: #15803d; color: #fff; }
    .badge.err { background: #b91c1c; color: #fff; }

    /* 레이아웃 */
    .app-layout {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .left-pane, .right-pane {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 카메라 박스 */
    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .guide-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .guide-frame {
      width: 92%;
      height: 44%;
      border: 3px solid #38bdf8;
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.42);
      transition: all 0.2s ease;
    }
    .guide-frame.narrow {
      width: 72%;
      height: 26%;
    }
    .guide-text {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #e0f2fe;
      background: rgba(0, 0, 0, 0.65);
      padding: 3px 10px;
      border-radius: 12px;
    }

    /* 상태 요약 카드 */
    .result-card {
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      background: var(--card);
      border: 2px solid var(--border);
    }
    .result-card.registered {
      background: rgba(22, 163, 74, 0.24);
      border-color: var(--success);
    }
    .result-card.unregistered {
      background: rgba(220, 38, 38, 0.28);
      border-color: var(--danger);
    }
    .plate-number {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 2px 0;
    }
    .result-status { font-size: 0.98rem; font-weight: 700; }
    .result-memo { font-size: 0.86rem; color: #cbd5e1; margin-top: 2px; }
    .raw-ocr { font-size: 0.74rem; color: var(--muted); margin-top: 4px; }

    /* 조작 버튼 */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button, .file-label {
      padding: 11px 8px;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      color: #fff;
      background: var(--primary);
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #334155; }
    button.auto-on { background: #0d9488; }

    /* 리스트 및 로그 섹션 */
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .section-header h2 { font-size: 0.92rem; }
    textarea {
      width: 100%;
      height: 110px;
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.88rem;
      line-height: 1.4;
      resize: vertical;
    }
    .list-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .list-actions button, .file-label {
      flex: 1;
      padding: 9px 6px;
      font-size: 0.82rem;
    }
    .file-label { background: #475569; display: inline-block; }
    input[type="file"] { display: none; }

    .log-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.82rem;
    }
    .log-list li {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .log-list li:last-child { border-bottom: none; }
    .tag-ok { color: #4ade80; font-weight: 700; }
    .tag-no { color: #f87171; font-weight: 700; }

    /* 판별 결과 팝업 (모달) */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .popup-overlay.show { display: flex; }
    .popup-box {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      border: 4px solid var(--success);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      animation: popIn 0.18s ease-out;
    }
    .popup-box.unreg {
      border-color: var(--danger);
      background: #2a1215;
    }
    .popup-box.reg {
      border-color: var(--success);
      background: #102a1c;
    }
    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .popup-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #fff;
    }
    .popup-box.reg .popup-badge { background: var(--success); }
    .popup-box.unreg .popup-badge { background: var(--danger); }
    .popup-plate {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin: 6px 0;
      color: #fff;
    }
    .popup-memo {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 18px;
    }
    .popup-close {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 10px;
      background: #334155;
      color: #fff;
      font-weight: 700;
    }

    /* 가로 모드 2단 레이아웃 */
    @media (orientation: landscape) and (min-width: 580px) {
      body {
        max-width: 100%;
        height: 100vh;
        overflow: hidden;
        padding: 8px 12px;
      }
      .app-layout {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 12px;
        height: calc(100vh - 52px);
      }
      .left-pane { height: 100%; }
      .camera-box { aspect-ratio: auto; height: 100%; }
      .right-pane { height: 100%; overflow-y: auto; padding-right: 4px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🚘 차량 번호판 감별기</h1>
    <div class="header-tools">
      <button type="button" id="camRetryBtn" class="mini-btn">📷 카메라 켜기</button>
      <button type="button" id="wakeBtn" class="mini-btn">☀️ 화면유지: OFF</button>
      <button type="button" id="landscapeBtn" class="mini-btn">↔️ 가로모드</button>
      <span id="engineStatus" class="badge">OCR 준비중...</span>
    </div>
  </header>

  <div class="app-layout">
    <!-- 카메라 화면 -->
    <div class="left-pane">
      <div class="camera-box">
        <video id="video" autoplay playsinline muted></video>
        <div class="guide-overlay">
          <div class="guide-frame" id="guideFrame"></div>
          <div class="guide-text" id="guideText">1차선 광역 인식 영역 (가로모드 권장)</div>
        </div>
      </div>
    </div>

    <!-- 제어 및 리스트 -->
    <div class="right-pane">
      <div id="resultCard" class="result-card">
        <div id="resultStatus" class="result-status">스캔 대기 중</div>
        <div id="plateDisplay" class="plate-number">--- ----</div>
        <div id="resultMemo" class="result-memo">카메라로 번호판을 비춰주세요</div>
        <div id="rawOcr" class="raw-ocr">인식 원문: -</div>
      </div>

      <div class="controls">
        <button type="button" id="scanBtn">🔍 지금 즉시 스캔</button>
        <button type="button" id="autoBtn" class="secondary">🔄 연속스캔: OFF</button>
        <button type="button" id="rangeBtn" class="secondary">📐 영역: 광역(1차선)</button>
        <button type="button" id="testPopupBtn" class="secondary">🔔 팝업 테스트</button>
      </div>

      <div class="section">
        <div class="section-header">
          <h2>📋 등록 차량 (<span id="listCount">0</span>대)</h2>
          <span style="font-size:0.74rem; color:var(--muted);">CSV 불러오기 시 기존 목록에 추가저장</span>
        </div>
        <textarea id="plateListInput" placeholder="한 줄에 하나씩 입력&#10;예: 12가3456 홍길동&#10;예: 외교001-001 대사관"></textarea>
        <div class="list-actions">
          <button type="button" id="saveListBtn">💾 리스트 저장</button>
          <label class="file-label" for="csvFileInput">📂 CSV 추가 불러오기</label>
          <input type="file" id="csvFileInput" accept=".csv,.txt" />
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2>🕒 최근 감별 기록</h2>
          <button type="button" id="clearLogBtn" class="secondary" style="padding:3px 8px; font-size:0.74rem;">지우기</button>
        </div>
        <ul id="logList" class="log-list">
          <li style="color:var(--muted);">아직 스캔된 기록이 없습니다.</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 등록/미등록 판별 결과 팝업 -->
  <div id="popupOverlay" class="popup-overlay">
    <div id="popupBox" class="popup-box reg">
      <div id="popupBadge" class="popup-badge">✅ 등록 차량 확인</div>
      <div id="popupPlate" class="popup-plate">12가3456</div>
      <div id="popupMemo" class="popup-memo">홍길동</div>
      <button type="button" id="popupCloseBtn" class="popup-close">확인 (닫기)</button>
    </div>
  </div>

  <canvas id="cropCanvas" style="display:none;"></canvas>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('video');
      const cropCanvas = document.getElementById('cropCanvas');
      const ctx = cropCanvas.getContext('2d', { willReadFrequently: true });

      const camRetryBtn = document.getElementById('camRetryBtn');
      const wakeBtn = document.getElementById('wakeBtn');
      const landscapeBtn = document.getElementById('landscapeBtn');
      const engineStatus = document.getElementById('engineStatus');
      const guideFrame = document.getElementById('guideFrame');
      const guideText = document.getElementById('guideText');

      const scanBtn = document.getElementById('scanBtn');
      const autoBtn = document.getElementById('autoBtn');
      const rangeBtn = document.getElementById('rangeBtn');
      const testPopupBtn = document.getElementById('testPopupBtn');

      const resultCard = document.getElementById('resultCard');
      const resultStatus = document.getElementById('resultStatus');
      const plateDisplay = document.getElementById('plateDisplay');
      const resultMemo = document.getElementById('resultMemo');
      const rawOcr = document.getElementById('rawOcr');

      const plateListInput = document.getElementById('plateListInput');
      const saveListBtn = document.getElementById('saveListBtn');
      const csvFileInput = document.getElementById('csvFileInput');
      const listCount = document.getElementById('listCount');
      const logList = document.getElementById('logList');
      const clearLogBtn = document.getElementById('clearLogBtn');

      const popupOverlay = document.getElementById('popupOverlay');
      const popupBox = document.getElementById('popupBox');
      const popupBadge = document.getElementById('popupBadge');
      const popupPlate = document.getElementById('popupPlate');
      const popupMemo = document.getElementById('popupMemo');
      const popupCloseBtn = document.getElementById('popupCloseBtn');

      let worker = null;
      let ocrReady = false;
      let isScanning = false;
      let autoScanTimer = null;
      let isWideMode = true;
      let registeredMap = new Map();
      let lastAlertedPlate = '';
      let lastAlertTime = 0;
      let popupTimer = null;

      /* =========================================
         1. 팝업 표시 기능 (등록차량 / 미등록차량)
      ========================================= */
      function showResultPopup(plate, isRegistered, memo) {
        if (popupTimer) clearTimeout(popupTimer);
        popupBox.className = 'popup-box ' + (isRegistered ? 'reg' : 'unreg');
        popupBadge.textContent = isRegistered ? '✅ 등록 차량 확인' : '🚨 미등록 차량 경고';
        popupPlate.textContent = plate;
        popupMemo.textContent = memo;
        popupOverlay.classList.add('show');

        // 3.5초 후 자동 닫힘
        popupTimer = setTimeout(() => {
          popupOverlay.classList.remove('show');
        }, 3500);
      }

      popupCloseBtn.addEventListener('click', () => {
        if (popupTimer) clearTimeout(popupTimer);
        popupOverlay.classList.remove('show');
      });

      popupOverlay.addEventListener('click', (e) => {
        if (e.target === popupOverlay) {
          if (popupTimer) clearTimeout(popupTimer);
          popupOverlay.classList.remove('show');
        }
      });

      testPopupBtn.addEventListener('click', () => {
        const firstEntry = registeredMap.entries().next().value;
        if (firstEntry) {
          showResultPopup(firstEntry[0], true, firstEntry[1]);
        } else {
          showResultPopup('12가3456', true, '샘플 등록 차량');
        }
      });

      /* =========================================
         2. 화면유지 (Wake Lock) & 가로모드 전환
      ========================================= */
      let wakeLock = null;
      let keepAwakeEnabled = false;

      wakeBtn.addEventListener('click', async () => {
        if (!('wakeLock' in navigator)) {
          alert('이 브라우저는 화면유지 기능을 지원하지 않습니다. 휴대폰 설정에서 화면 자동 꺼짐 시간을 늘려주세요.');
          return;
        }
        try {
          if (!keepAwakeEnabled) {
            wakeLock = await navigator.wakeLock.request('screen');
            keepAwakeEnabled = true;
            wakeBtn.textContent = '☀️ 화면유지: ON';
            wakeBtn.classList.add('wake-on');
          } else {
            keepAwakeEnabled = false;
            if (wakeLock) await wakeLock.release();
            wakeLock = null;
            wakeBtn.textContent = '☀️ 화면유지: OFF';
            wakeBtn.classList.remove('wake-on');
          }
        } catch (err) {
          alert('화면유지 설정 오류: ' + err.message);
        }
      });

      document.addEventListener('visibilitychange', async () => {
        if (keepAwakeEnabled && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
      });

      landscapeBtn.addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
              await screen.orientation.lock('landscape').catch(() => {});
            }
            landscapeBtn.textContent = '↩️ 기본화면';
          } else {
            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
            await document.exitFullscreen();
            landscapeBtn.textContent = '↔️ 가로모드';
          }
        } catch (err) {
          alert('휴대폰 상단바에서 [화면 회전]을 켜고 기기를 가로로 눕혀주세요.');
        }
      });

      rangeBtn.addEventListener('click', () => {
        isWideMode = !isWideMode;
        if (isWideMode) {
          guideFrame.classList.remove('narrow');
          guideText.textContent = '1차선 광역 인식 영역 (가로모드 권장)';
          rangeBtn.textContent = '📐 영역: 광역(1차선)';
        } else {
          guideFrame.classList.add('narrow');
          guideText.textContent = '파란 박스 안에 번호판을 맞춰주세요';
          rangeBtn.textContent = '📐 영역: 집중(근거리)';
        }
      });

      /* =========================================
         3. 차량 리스트 관리 & CSV 추가저장
      ========================================= */
      const DEFAULT_LIST = `12가3456 샘플차량1\n123나4567 샘플차량2\n외교001-001 외교차량샘플`;

      function extractEntriesFromText(rawText) {
        const result = new Map();
        const lines = rawText.split(/\r?\n/);
        const stdRegex = /(\d{2,3}[가-힣]\d{4})/;
        const diploRegex = /(외교|영사|준외|준영|국기|협정|대표)\s*(\d{3})\s*-?\s*(\d{3})/;

        lines.forEach(line => {
          // CSV 쉼표/탭을 공백으로 변환
          const cleanedLine = line.replace(/[,\t]+/g, ' ').replace(/\s+/g, ' ').trim();
          if (!cleanedLine) return;

          const diploMatch = cleanedLine.match(diploRegex);
          if (diploMatch) {
            const plate = `${diploMatch[1]}${diploMatch[2]}-${diploMatch[3]}`;
            const memo = cleanedLine.replace(diploMatch[0], '').replace(/^[,;\s-]+/, '').trim();
            result.set(plate, memo || '등록 차량');
            return;
          }

          const compactForMatch = cleanedLine.replace(/(\d{2,3}\s*[가-힣])\s*(\d{4})/, '$1$2');
          const stdMatch = compactForMatch.match(stdRegex);
          if (stdMatch) {
            const plate = stdMatch[1];
            const memo = compactForMatch.replace(plate, '').replace(/^[,;\s-]+/, '').trim();
            result.set(plate, memo || '등록 차량');
          }
        });
        return result;
      }

      function syncMapToTextareaAndStorage() {
        const formattedLines = [];
        registeredMap.forEach((memo, plate) => {
          formattedLines.push(memo && memo !== '등록 차량' ? `${plate} ${memo}` : plate);
        });
        const finalStr = formattedLines.join('\n');
        plateListInput.value = finalStr;
        listCount.textContent = registeredMap.size;
        try {
          localStorage.setItem('peter_plate_list', finalStr);
        } catch (e) {}
      }

      function loadSavedList() {
        let saved = null;
        try {
          saved = localStorage.getItem('peter_plate_list');
        } catch (e) {}
        const initialText = saved !== null ? saved : DEFAULT_LIST;
        registeredMap = extractEntriesFromText(initialText);
        plateListInput.value = initialText;
        listCount.textContent = registeredMap.size;
      }

      saveListBtn.addEventListener('click', () => {
        registeredMap = extractEntriesFromText(plateListInput.value);
        syncMapToTextareaAndStorage();
        alert(`총 ${registeredMap.size}대의 차량 번호가 저장되었습니다.`);
      });

      // CSV 불러오기 -> 기존 리스트에 추가저장 (UTF-8 및 EUC-KR 자동 감지)
      csvFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const buffer = evt.target.result;
          let text = '';
          try {
            text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
          } catch (err) {
            text = new TextDecoder('euc-kr').decode(buffer);
          }

          // 현재 입력창에 적힌 기존 리스트 먼저 반영
          registeredMap = extractEntriesFromText(plateListInput.value);
          const beforeCount = registeredMap.size;

          // CSV 파일의 번호들을 기존 목록에 추가(병합)
          const importedEntries = extractEntriesFromText(text);
          importedEntries.forEach((memo, plate) => {
            registeredMap.set(plate, memo);
          });

          syncMapToTextareaAndStorage();
          const addedCount = registeredMap.size - beforeCount;
          alert(`CSV 파일에서 ${importedEntries.size}건을 읽어 기존 리스트에 추가 저장했습니다.\n(신규 추가: ${addedCount}대 / 전체 등록: ${registeredMap.size}대)`);
          csvFileInput.value = '';
        };
        reader.readAsArrayBuffer(file);
      });

      /* =========================================
         4. 카메라 연결 (안전 예외 처리)
      ========================================= */
      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          resultStatus.textContent = '⚠️ 카메라 차단됨 (HTTPS 주소 필요)';
          resultMemo.textContent = '보안 연결(https://) 페이지에서 열어야 카메라가 작동합니다.';
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            },
            audio: false
          });
          video.srcObject = stream;
          await video.play().catch(() => {});
          resultStatus.textContent = '카메라 연결 완료 · 스캔 대기 중';
          camRetryBtn.textContent = '📷 카메라 연결됨';
        } catch (err) {
          resultStatus.textContent = '⚠️ 카메라 권한 필요';
          resultMemo.textContent = '브라우저 카메라 권한을 허용한 뒤 [카메라 켜기]를 눌러주세요.';
          alert('카메라 실행 오류: ' + err.message);
        }
      }

      camRetryBtn.addEventListener('click', startCamera);

      /* =========================================
         5. OCR 엔진 초기화 (Tesseract.js v5)
      ========================================= */
      async function initOCR() {
        if (typeof Tesseract === 'undefined') {
          engineStatus.textContent = 'OCR 스크립트 오류';
          engineStatus.classList.add('err');
          return;
        }
        try {
          worker = await Tesseract.createWorker('kor');
          await worker.setParameters({ tessedit_pageseg_mode: '11' });
          ocrReady = true;
          engineStatus.textContent = '스캔 준비 완료';
          engineStatus.classList.add('ready');
        } catch (err) {
          engineStatus.textContent = 'OCR 로딩 실패';
          engineStatus.classList.add('err');
          console.error(err);
        }
      }

      /* =========================================
         6. 이미지 전처리 및 번호판 스캔
      ========================================= */
      function captureAndPreprocess() {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) return false;

        const wRatio = isWideMode ? 0.92 : 0.72;
        const hRatio = isWideMode ? 0.44 : 0.26;

        const cropW = Math.floor(vw * wRatio);
        const cropH = Math.floor(vh * hRatio);
        const cropX = Math.floor((vw - cropW) / 2);
        const cropY = Math.floor((vh - cropH) / 2);

        cropCanvas.width = cropW;
        cropCanvas.height = cropH;
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        const imgData = ctx.getImageData(0, 0, cropW, cropH);
        const data = imgData.data;
        const contrast = 48;
        const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));

        for (let i = 0; i < data.length; i += 4) {
          const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          const adj = Math.min(255, Math.max(0, factor * (gray - 128) + 128));
          data[i] = data[i + 1] = data[i + 2] = adj;
        }
        ctx.putImageData(imgData, 0, 0);
        return true;
      }

      function triggerAlert(isRegistered) {
        if (navigator.vibrate) {
          navigator.vibrate(isRegistered ? [120] : [250, 100, 250]);
        }
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = isRegistered ? 'sine' : 'sawtooth';
          osc.frequency.setValueAtTime(isRegistered ? 880 : 480, audioCtx.currentTime);
          if (!isRegistered) osc.frequency.setValueAtTime(340, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + (isRegistered ? 0.18 : 0.35));
        } catch (e) {}
      }

      function addLog(plate, isRegistered, memo) {
        if (logList.children.length === 1 && logList.children[0].textContent.includes('아직')) {
          logList.innerHTML = '';
        }
        const now = new Date().toTimeString().slice(0, 8);
        const li = document.createElement('li');
        li.innerHTML = `
          <span><strong>${plate}</strong> <small style="color:var(--muted);">(${memo})</small></span>
          <span class="${isRegistered ? 'tag-ok' : 'tag-no'}">${isRegistered ? '등록' : '미등록'} · ${now}</span>
        `;
        logList.prepend(li);
        if (logList.children.length > 20) {
          logList.removeChild(logList.lastChild);
        }
      }

      async function scanPlate() {
        if (isScanning) return;
        if (!ocrReady || !worker) {
          alert('OCR 엔진이 아직 로딩 중입니다. 상단이 [스캔 준비 완료]로 바뀌면 다시 눌러주세요.');
          return;
        }
        if (!captureAndPreprocess()) {
          alert('카메라 영상이 아직 준비되지 않았습니다. 상단의 [📷 카메라 켜기] 버튼을 먼저 눌러주세요.');
          return;
        }

        isScanning = true;
        scanBtn.textContent = '⏳ 인식 중...';

        try {
          const { data: { text } } = await worker.recognize(cropCanvas);
          const cleaned = text.replace(/[^0-9가-힣]/g, '');
          rawOcr.textContent = `인식 원문: ${cleaned || '(인식된 문자 없음)'}`;

          let plate = null;
          const stdMatch = cleaned.match(/\d{2,3}[가-힣]\d{4}/);
          const diploMatch = cleaned.match(/(외교|영사|준외|준영|국기|협정|대표)(\d{3})(\d{3})/);

          if (stdMatch) {
            plate = stdMatch[0];
          } else if (diploMatch) {
            plate = `${diploMatch[1]}${diploMatch[2]}-${diploMatch[3]}`;
          }

          if (plate) {
            const isRegistered = registeredMap.has(plate);
            const memo = isRegistered ? registeredMap.get(plate) : '리스트에 없는 미등록 차량';

            plateDisplay.textContent = plate;
            resultCard.className = 'result-card ' + (isRegistered ? 'registered' : 'unregistered');
            resultStatus.textContent = isRegistered ? '✅ 등록된 차량입니다' : '🚨 미등록 차량입니다';
            resultMemo.textContent = memo;

            const now = Date.now();
            if (plate !== lastAlertedPlate || now - lastAlertTime > 4000) {
              triggerAlert(isRegistered);
              addLog(plate, isRegistered, memo);
              showResultPopup(plate, isRegistered, memo);
              lastAlertedPlate = plate;
              lastAlertTime = now;
            }
          }
        } catch (err) {
          console.error(err);
        } finally {
          isScanning = false;
          scanBtn.textContent = '🔍 지금 즉시 스캔';
        }
      }

      scanBtn.addEventListener('click', scanPlate);

      autoBtn.addEventListener('click', () => {
        if (autoScanTimer) {
          clearInterval(autoScanTimer);
          autoScanTimer = null;
          autoBtn.textContent = '🔄 연속스캔: OFF';
          autoBtn.classList.remove('auto-on');
        } else {
          scanPlate();
          autoScanTimer = setInterval(scanPlate, 1500);
          autoBtn.textContent = '🔄 연속스캔: ON';
          autoBtn.classList.add('auto-on');
        }
      });

      clearLogBtn.addEventListener('click', () => {
        logList.innerHTML = '<li style="color:var(--muted);">아직 스캔된 기록이 없습니다.</li>';
      });

      // 순차 초기화 실행
      loadSavedList();
      startCamera();
      initOCR();
    });
  </script>
</body>
</html>
